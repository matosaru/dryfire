name: Diagnose public startup HTML and JavaScript
on:
  push:
    branches: [b]
    paths: ['.github/workflows/diagnose-public-startup.yml', 'docs/design/review-inputs/chg-052-parser.patch']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      APP_EDITION: public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b
      - uses: actions/checkout@v4
        with:
          ref: 6c38bff81662d30279d94d41ca5c949bdbbe1c6e
          path: .performance-baseline
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.performance-baseline"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git apply docs/design/review-inputs/chg-052-parser.patch
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: .performance-baseline
      - run: npm run build
        working-directory: .performance-baseline
      - run: npm run build
      - run: node --experimental-vm-modules tools/performance/diagnose-startup.mjs --baseline=.performance-baseline/dist --candidate=dist --browser=webkit

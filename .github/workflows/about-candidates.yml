name: Collect About design candidates
on:
  push:
    branches: [feature/about-contact-page]
    paths: ['index.html', 'src/main.js', 'src/styles.css', 'visual-tests/**', 'about-candidates.config.js', '.github/workflows/about-candidates.yml']
permissions:
  contents: write
  pull-requests: write
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:dist
      - run: npx --no-install playwright test --config about-candidates.config.js
      - name: Compare unchanged candidates in both browsers
        run: npx --no-install playwright test --config about-candidates.config.js
        env:
          VISUAL_CANDIDATES_COMPARE: '1'
      - run: cp test-results/build-manifest.json visual-candidates/build-manifest.json
      - run: cp test-results/results.json visual-candidates/validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: about-design-candidates
          path: |
            playwright-report/
            test-results/
            visual-candidates/
          retention-days: 14
          if-no-files-found: error
      - name: Publish candidates on the feature branch only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$GITHUB_REF_NAME" = 'feature/about-contact-page'
          test "$(git ls-remote origin refs/heads/feature/about-contact-page | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-candidates/
          git commit -m 'test: collect unreviewed About and Settings design candidates'
          git push origin HEAD:feature/about-contact-page
      - name: Prepare the authorized feature PR without merging unreviewed candidates
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const existing = await github.rest.pulls.list({ ...repo, state: 'open', base: 'dev', head: `${repo.owner}:feature/about-contact-page` });
            if (existing.data.length) { core.info(`Feature PR already exists: ${existing.data[0].html_url}`); return; }
            const result = await github.rest.pulls.create({ ...repo, base: 'dev', head: 'feature/about-contact-page', draft: true,
              title: 'Add About page and email contact',
              body: 'Adds a dedicated About screen, available before gun setup, with the confirmed email contact and local-data/recognition explanations. Copy and Dark/Light browser images are being reviewed on the feature branch.\n\nThe user authorized checked promotion into dev and main for this release only. Broader commercial/SEO/account implementations remain paused. Do not merge until reviewed baselines and source/browser checks pass.' });
            core.info(`Prepared feature PR: ${result.data.html_url}`);

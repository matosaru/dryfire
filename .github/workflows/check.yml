name: Test and build
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_patch != '' && format('Pre-merge candidate {0}', inputs.candidate_patch) || format('Test and build · {0}', github.ref_name) }}
on:
  push:
    branches: [main, b, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_patch:
        description: 'Optional repository-relative review patch, validated without merging application code'
        type: string
        required: false
        default: ''
      candidate_design_ref:
        description: 'Optional immutable commit supplying candidate PNG/GIF references only'
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate for pre-merge acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_patch != ''
        env:
          CANDIDATE_PATCH: ${{ inputs.candidate_patch }}
          CANDIDATE_DESIGN_REF: ${{ inputs.candidate_design_ref }}
        run: node tools/apply-review-candidate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:profile
      - run: npm run typecheck
      - run: npm run lint:components
      - run: npm run lint:runtime
      - run: npm run verify:architecture
      - run: npm run docs:check
      - run: npm run test:smoke
      - run: npm run test:coverage -- --reporters=default --reporters=./tools/ci-test-reporter.cjs
        timeout-minutes: 3
      - run: npm run coverage:check
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-test-coverage
          path: coverage/
          retention-days: 14
      - run: npm run build
      - run: npm run verify:dist
      - run: npm run deploy:check
      - name: Identify the verified default artifact
        id: artifact
        run: |
          node --input-type=module -e "import { readBuildProfile } from './tools/build-profile.mjs'; console.log('name=' + (readBuildProfile() === 'preview' ? 'private-preview-web-app' : 'minified-web-app'));" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          if-no-files-found: error
      - name: Verify the private preview and fail-closed asset Worker without deploying
        run: |
          npm run build:public
          npm run verify:dist -- --edition=public
          npx --no-install wrangler deploy --config wrangler.public.jsonc --env "" --dry-run
          npx --no-install wrangler deploy --config wrangler.public.jsonc --env dev --dry-run
          npm run build:preview
          npm run private-preview:check
  screenshot_editions:
    name: screenshots (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [public, preview]
    runs-on: ubuntu-24.04
    # Complete fixed browser coverage plus diff probe, artifacts and container cleanup.
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      APP_EDITION: ${{ matrix.edition }}
      VISUAL_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - name: Trust only the checked-out repository inside the rendering container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Apply candidate for pre-merge acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_patch != ''
        env:
          CANDIDATE_PATCH: ${{ inputs.candidate_patch }}
          CANDIDATE_DESIGN_REF: ${{ inputs.candidate_design_ref }}
        run: node tools/apply-review-candidate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the selected edition
        run: |
          if npm run build > /tmp/edition-build.log 2>&1; then
            cat /tmp/edition-build.log
          else
            cat /tmp/edition-build.log
            cat /tmp/edition-build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - run: npm run verify:dist -- --edition=${{ matrix.edition }}
      - name: Require reviewed baseline coverage and fingerprints
        run: npm run visual:review
      - name: Compare Chromium and WebKit screenshots
        run: npm run test:visual
      - name: Report complete browser failure details
        if: always()
        run: node tools/report-browser-failures.mjs
      - name: Prove visible defects fail and produce difference images
        run: npm run visual:probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-checks-${{ matrix.edition }}
          path: |
            playwright-report/
            test-results/
            playwright-probe-report/
            test-results-probe/
          retention-days: 14
          if-no-files-found: error
  performance_editions:
    name: performance (${{ matrix.edition }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        edition: [public, preview]
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      APP_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate for pre-merge acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_patch != ''
        env:
          CANDIDATE_PATCH: ${{ inputs.candidate_patch }}
          CANDIDATE_DESIGN_REF: ${{ inputs.candidate_design_ref }}
        run: node tools/apply-review-candidate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Choose the immutable matching application baseline
        id: baseline
        run: |
          node --input-type=module -e "import { readBuildProfile, resolveBuildEdition } from './tools/build-profile.mjs'; const edition = resolveBuildEdition({ defaultEdition: readBuildProfile(), explicit: process.env.APP_EDITION }); console.log('source=' + (edition === 'preview' ? 'a5b76e8d524c311bcbde1dc5740b2f5d0fa8e8bd' : '6c38bff81662d30279d94d41ca5c949bdbbe1c6e'));" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.source }}
          path: .performance-baseline
          persist-credentials: false
      - name: Trust only the two test checkouts in the rendering container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.performance-baseline"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: .performance-baseline
      - run: npm run build
        working-directory: .performance-baseline
      - run: npm run build
      - run: npm run verify:dist -- --edition=${{ matrix.edition }}
      - name: Compare actual critical payload, cold/warm startup, input and cleanup
        run: npm run perf:compare -- --baseline=.performance-baseline/dist --candidate=dist --browser=${{ matrix.browser }}
      - name: Publish performance evidence and failure annotations
        id: performance_report
        if: always()
        run: node tools/performance/report.mjs
      - name: "Timing result: ${{ steps.performance_report.outputs.outcome || 'report unavailable' }}"
        if: always()
        run: ':'
      - name: Measure identical-build timing control on the same runner
        if: always()
        run: npm run perf:compare -- --baseline=.performance-baseline/dist --candidate=.performance-baseline/dist --browser=${{ matrix.browser }} --runs=20 --output=performance-results/control.json
      - name: Publish identical-build control evidence
        if: always()
        run: node tools/performance/report.mjs performance-results/control.json
      - name: Prove the gate rejects a deliberate runtime slowdown
        if: always() && matrix.edition == 'public' && matrix.browser == 'chromium'
        run: node tools/performance/probe-timing.mjs --baseline=.performance-baseline/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-checks-${{ matrix.edition }}-${{ matrix.browser }}
          path: performance-results/
          retention-days: 14
          if-no-files-found: warn
  screenshots:
    # Preserve the existing required-check name while requiring both editions.
    needs: [screenshot_editions, performance_editions]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both edition jobs to succeed
        env:
          EDITION_RESULT: ${{ needs.screenshot_editions.result }}
          PERFORMANCE_RESULT: ${{ needs.performance_editions.result }}
        run: test "$EDITION_RESULT" = 'success' && test "$PERFORMANCE_RESULT" = 'success'

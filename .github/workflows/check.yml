name: Test and build
on:
  push:
    branches: [main, b, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:profile
      - run: npm run docs:check
      - run: npm run test:smoke
      - run: npm test
        timeout-minutes: 3
      - run: npm run build
      - run: npm run verify:dist
      - run: npm run deploy:check
      - name: Identify the verified default artifact
        id: artifact
        run: |
          node --input-type=module -e "import { readBuildProfile } from './tools/build-profile.mjs'; console.log('name=' + (readBuildProfile() === 'preview' ? 'private-preview-web-app' : 'minified-web-app'));" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          if-no-files-found: error
      - name: Verify the private preview and fail-closed asset Worker without deploying
        run: |
          npm run build:public
          npm run verify:dist -- --edition=public
          npx --no-install wrangler deploy --config wrangler.public.jsonc --env "" --dry-run
          npx --no-install wrangler deploy --config wrangler.public.jsonc --env dev --dry-run
          npm run build:preview
          npm run private-preview:check
  screenshot_editions:
    name: screenshots (${{ matrix.edition }})
    strategy:
      fail-fast: false
      matrix:
        edition: [public, preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      APP_EDITION: ${{ matrix.edition }}
      VISUAL_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - name: Trust only the checked-out repository inside the rendering container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the selected edition
        run: |
          if npm run build > /tmp/edition-build.log 2>&1; then
            cat /tmp/edition-build.log
          else
            cat /tmp/edition-build.log
            cat /tmp/edition-build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - run: npm run verify:dist -- --edition=${{ matrix.edition }}
      - name: Require reviewed baseline coverage and fingerprints
        run: npm run visual:review
      - name: Compare Chromium and WebKit screenshots
        run: npm run test:visual
      - name: Prove visible defects fail and produce difference images
        run: npm run visual:probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-checks-${{ matrix.edition }}
          path: |
            playwright-report/
            test-results/
            playwright-probe-report/
            test-results-probe/
          retention-days: 14
          if-no-files-found: error
  screenshots:
    # Preserve the existing required-check name while requiring both editions.
    needs: screenshot_editions
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both edition jobs to succeed
        env:
          EDITION_RESULT: ${{ needs.screenshot_editions.result }}
        run: test "$EDITION_RESULT" = 'success'
  publish_approved_guides:
    name: Publish approved CHG-045 release once
    needs: [validate, screenshots]
    if: github.event_name == 'push' && github.ref == 'refs/heads/b' && contains(github.event.head_commit.message, '[release-CHG-045]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the approved public source and an unconsumed release
        id: release
        run: |
          test "$(node -p 'require("./build-profile.json").edition')" = 'public'
          git merge-base --is-ancestor 98e4bbd594d0961692ceff28a9d72cceab20eb3c HEAD
          test "$(git ls-remote origin refs/heads/b | cut -f1)" = "$GITHUB_SHA"
          if git cat-file -e origin/main:docs/design/baselines/practice-guides-review.json 2>/dev/null && git show origin/main:docs/design/baselines/practice-guides-review.json | cmp - docs/design/baselines/practice-guides-review.json; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create and merge the tested release PR under repository protections
        if: steps.release.outputs.needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const current = await github.rest.repos.getBranch({...repo, branch: 'b'});
            if (current.data.commit.sha !== context.sha) throw new Error('b advanced after validation; refusing stale release.');
            const prs = await github.rest.pulls.list({...repo, state: 'open', base: 'main', head: `${repo.owner}:b`});
            let pr = prs.data[0];
            if (!pr) pr = (await github.rest.pulls.create({...repo, base: 'main', head: 'b',
              title: 'Synchronize practice guides, screenshots and GIFs with live drills',
              body: `Adds contextual manuals for six practice modes and selected ordered drills. Examples reuse the live run/review templates and presentation, with silent synthetic events and no microphone or saved outcomes. Back preserves setup drafts.\n\nUpdates reviewed screenshots, maintained GIF exports and specifications. Source/hash checks detect stale guide media.\n\nValidation: source, build, smoke/unit, both Chromium/WebKit editions and deliberate visual-defect probes passed: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}.\n\nThe owner explicitly requested this b-to-main PR and automatic merge for CHG-045. Existing branch protections remain enforced; this one-off job stops after that source is included in main.`
            })).data;
            if (pr.head.sha !== context.sha) throw new Error('PR head differs from the tested b commit.');
            core.notice(`Release PR: ${pr.html_url}`);
            const result = await github.rest.pulls.merge({...repo, pull_number: pr.number, sha: context.sha, merge_method: 'merge'});
            if (!result.data.merged) throw new Error(result.data.message || 'Repository refused merge.');
            core.notice(`Merged ${pr.html_url} at ${result.data.sha}`);
            // GITHUB_TOKEN merges do not trigger push workflows. Explicitly run
            // the same full validation on main; no deployment is performed here.
            await github.rest.actions.createWorkflowDispatch({...repo, workflow_id: 'check.yml', ref: 'main'});

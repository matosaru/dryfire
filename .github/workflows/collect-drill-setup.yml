name: Collect CHG-058 shared setup candidates
on:
  push:
    branches: [b]
    paths: ['.github/workflows/collect-drill-setup.yml', 'docs/design/review-inputs/chg-058-setup.patch']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    if: github.ref == 'refs/heads/b'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      COLLECT_SETUP_CANDIDATES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply review-only implementation patch
        run: git apply docs/design/review-inputs/chg-058-setup.patch
      - run: npm ci --no-audit --no-fund
      - name: Collect pinned candidate images, never accept baselines
        run: |
          APP_EDITION=public npm run build
          APP_EDITION=public VISUAL_EDITION=public npx playwright test screens.spec.js --grep 'practice/'
          APP_EDITION=preview npm run build
          APP_EDITION=preview VISUAL_EDITION=preview npx playwright test screens.spec.js --grep 'practice/'
      - name: Publish images for separate review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/review-candidates/chg-058
          git commit -m 'test: collect pinned CHG-058 shared setup review images [skip ci]'
          git pull --rebase --autostash origin b
          git push origin HEAD:b

name: Regenerate reviewed React guide exports
on:
  push:
    branches: [b]
    paths: ['.github/workflows/refactor-parity.yml']
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Use the established image encoder
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pil
      - run: npm run build:public && npm run verify:dist -- --edition=public
      - name: Export actual guide frames and encode current GIFs
        run: |
          node tools/export-guide-examples.mjs --output /tmp/refactor-guide-frames
          python3 tools/encode-guide-examples.py /tmp/refactor-guide-frames visual-candidates/react-refactor/guide-examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-refactor-guide-exports
          path: visual-candidates/react-refactor/guide-examples/
          if-no-files-found: error
      - name: Publish unaccepted media only to the exact source branch
        run: |
          test "$GITHUB_REF_NAME" = 'b'
          test "$(git ls-remote origin refs/heads/b | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-candidates/react-refactor/guide-examples/
          git commit -m 'test: collect regenerated guide exports for React style composition'
          git push origin HEAD:b

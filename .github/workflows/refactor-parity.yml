name: Review React migration parity and guide exports
on:
  push:
    branches: [b]
    paths: ['.github/workflows/refactor-parity.yml']
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run lint:components && npm run verify:architecture
      - run: npm test && npm run test:smoke
      - name: Compare both editions with the unchanged reviewed browser references
        run: |
          for edition in public preview; do
            export APP_EDITION="$edition" VISUAL_EDITION="$edition"
            npm run build
            npm run verify:dist -- --edition="$edition"
            npm run visual:review
            npm run test:visual
            npm run visual:probe
            mkdir -p visual-candidates/react-refactor
            cp test-results/build-manifest.json "visual-candidates/react-refactor/$edition-build.json"
            cp test-results/results.json "visual-candidates/react-refactor/$edition-results.json"
          done
      - name: Regenerate guide media from the unchanged actual component in the pinned renderer
        run: |
          npm run build:public
          node tools/export-guide-examples.mjs --output /tmp/refactor-guide-frames
          python3 -m pip install --break-system-packages Pillow==11.3.0
          python3 tools/encode-guide-examples.py /tmp/refactor-guide-frames visual-candidates/react-refactor/guide-examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-refactor-parity
          path: |
            visual-candidates/
            playwright-report/
            test-results/
            playwright-probe-report/
            test-results-probe/
          if-no-files-found: error
      - name: Publish review evidence only to the exact source branch
        run: |
          test "$GITHUB_REF_NAME" = 'b'
          test "$(git ls-remote origin refs/heads/b | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-candidates/react-refactor/
          git commit -m 'test: collect React parity evidence and current guide exports'
          git push origin HEAD:b

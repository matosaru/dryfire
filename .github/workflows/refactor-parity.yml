name: Recover React export diagnostics
on:
  push:
    branches: [b]
    paths: ['.github/workflows/refactor-parity.yml']
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: react-refactor-parity
          run-id: 38900997369
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/react-recovered
      - name: Retain compact passing comparison reports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('visual-candidates/react-refactor');out.mkdir(parents=True,exist_ok=True)
          for name in ['public-build.json','public-results.json','preview-build.json','preview-results.json']:
              source=list(Path('/tmp/react-recovered').rglob(name));assert len(source)==1,(name,source)
              shutil.copyfile(source[0],out/name)
          PY
      - name: Read the failed export step from the existing job logs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const result = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, job_id: 116972921519 });
            const log = typeof result.data === 'string' ? result.data : Buffer.from(result.data).toString('utf8');
            const lines = log.split('\n');
            const at = lines.findLastIndex(line => /Error:|ERROR|Traceback|error:/.test(line));
            const excerpt = lines.slice(Math.max(0, at-12), at+25).join('\n');
            fs.writeFileSync('visual-candidates/react-refactor/export-error.json', JSON.stringify({ run: 38900997369, job: 116972921519, excerpt }, null, 2)+'\n');
      - name: Publish unaccepted diagnostics only to the exact source branch
        if: always()
        run: |
          test "$GITHUB_REF_NAME" = 'b'
          test "$(git ls-remote origin refs/heads/b | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-candidates/react-refactor/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: retain passing React comparison evidence and export error'
          git push origin HEAD:b

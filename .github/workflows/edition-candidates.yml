name: Collect shared page template candidates
on:
  push:
    branches: [b]
    paths: ['index.html', 'src/**', 'visual-tests/**', 'vite.config.js', 'tools/page-templates.mjs', 'edition-candidates.config.js', '.github/workflows/edition-candidates.yml']
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
      - name: Trust only the checked-out repository inside the rendering container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate and compare both editions in the pinned browsers
        run: |
          for edition in public preview; do
            export APP_EDITION="$edition" VISUAL_EDITION="$edition"
            if npm run build > /tmp/edition-build.log 2>&1; then
              cat /tmp/edition-build.log
            else
              cat /tmp/edition-build.log
              cat /tmp/edition-build.log >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            npm run verify:dist -- --edition="$edition"
            npx --no-install playwright test --config edition-candidates.config.js
            VISUAL_CANDIDATES_COMPARE=1 npx --no-install playwright test --config edition-candidates.config.js
            mkdir -p visual-candidates
            cp test-results/build-manifest.json "visual-candidates/$edition-build-manifest.json"
            cp test-results/results.json "visual-candidates/$edition-validation.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-page-template-candidates
          path: |
            playwright-report/
            test-results/
            visual-candidates/
          retention-days: 14
          if-no-files-found: error
      - name: Publish unaccepted candidates only to their source b branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$GITHUB_REF_NAME" = 'b'
          test "$(git ls-remote origin refs/heads/b | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-candidates/
          git commit -m 'test: collect shared page template screenshot candidates'
          git push origin HEAD:b

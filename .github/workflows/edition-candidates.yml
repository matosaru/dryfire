name: Collect Beta disclosure candidates
on:
  push:
    branches: [b]
    paths: ['index.html', 'src/**', 'visual-tests/**', 'vite.config.js', 'tools/page-templates.mjs', 'edition-candidates.config.js', '.github/workflows/edition-candidates.yml']
permissions:
  contents: write
  actions: read
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
      - name: Trust only the checked-out repository inside the rendering container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Recover the original mismatch images without accepting them
        uses: actions/download-artifact@v4
        with:
          name: beta-disclosure-candidates
          run-id: 38685501498
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: visual-candidates/recovered-original
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-disclosure-candidates
          path: |
            playwright-report/
            test-results/
            visual-candidates/
          retention-days: 14
          if-no-files-found: error
      - name: Publish unaccepted candidates only to their source b branch
        if: always()
        run: |
          test -d visual-candidates || exit 0
          mkdir -p visual-candidates/diagnostics
          if test -d test-results; then cp -R test-results visual-candidates/diagnostics/; fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$GITHUB_REF_NAME" = 'b'
          test "$(git ls-remote origin refs/heads/b | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-candidates/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: collect unaccepted Beta disclosure diagnostics'
          git push origin HEAD:b

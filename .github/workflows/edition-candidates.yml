name: Collect practice guide candidates
on:
  push:
    branches: [b]
    paths: ['src/**', 'workers/**', 'visual-tests/**', 'edition-candidates.config.js', '.github/workflows/edition-candidates.yml']
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Correct and compare affected Light guides in both pinned editions
        run: |
          for edition in public preview; do
            export APP_EDITION="$edition" VISUAL_EDITION="$edition"
            npm run build
            npm run verify:dist -- --edition="$edition"
            npx --no-install playwright test --config edition-candidates.config.js -g 'practice-guide/.*\.light|actual Reload endpoints'
            cp test-results/results.json "visual-candidates/light-$edition-generation-validation.json"
            VISUAL_CANDIDATES_COMPARE=1 npx --no-install playwright test --config edition-candidates.config.js -g 'practice-guide/.*\.light|actual Reload endpoints'
            cp test-results/build-manifest.json "visual-candidates/light-$edition-build-manifest.json"
            cp test-results/results.json "visual-candidates/light-$edition-validation.json"
          done
      - name: Export actual shared guide examples and encode maintained GIFs
        run: |
          npm run build:public
          npm run verify:dist -- --edition=public
          node tools/export-guide-examples.mjs --output /tmp/dryfire-guide-frames
          apt-get update -qq
          apt-get install -y -qq python3-pil
          python3 tools/encode-guide-examples.py /tmp/dryfire-guide-frames visual-candidates/guide-examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-guide-candidates
          path: |
            playwright-report/
            test-results/
            visual-candidates/
          retention-days: 14
          if-no-files-found: error
      - name: Publish unaccepted candidates to their exact source b branch
        run: |
          test "$GITHUB_REF_NAME" = 'b'
          test "$(git ls-remote origin refs/heads/b | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-candidates/
          git commit -m 'test: collect practice guide screenshot candidates'
          git push origin HEAD:b

name: Collect CHG-062 guide export evidence
on:
  push:
    branches: [b]
    paths: ['.github/workflows/collect-header-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    if: github.ref == 'refs/heads/b'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git apply docs/design/review-inputs/chg-062-header.patch
      - run: npm ci --no-audit --no-fund
      - name: Regenerate cropped guide examples in the pinned renderer
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pil
          APP_EDITION=public npm run build
          node tools/export-guide-examples.mjs --output /tmp/chg062-guide-frames
          python3 tools/encode-guide-examples.py /tmp/chg062-guide-frames docs/design/review-candidates/chg-062/examples
      - name: Publish only review images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/review-candidates/chg-062
          git commit -m 'test: collect pinned CHG-062 shared-header candidates [skip ci]'
          git push origin HEAD:b

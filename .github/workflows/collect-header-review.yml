name: Collect CHG-062 shared-header review images
on:
  push:
    branches: [b]
    paths: ['.github/workflows/collect-header-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    if: github.ref == 'refs/heads/b'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git apply docs/design/review-inputs/chg-062-header.patch
      - run: npm ci --no-audit --no-fund
      - name: Collect separate candidate images without accepting references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('visual-tests/screens.spec.js');s=p.read_text().replace("import { readFileSync } from 'node:fs';", "import { readFileSync, mkdirSync } from 'node:fs';")
          s=s.replace("await expect(page).toHaveScreenshot(baselineName(item).split('/'));", "const path=`docs/design/review-candidates/chg-062/${testInfo.project.name}/${baselineName(item)}`;mkdirSync(path.slice(0,path.lastIndexOf('/')),{recursive:true});await page.screenshot({path,fullPage:false,animations:'disabled',caret:'hide',scale:'css'});")
          p.write_text(s)
          PY
          APP_EDITION=public npm run build
          APP_EDITION=public VISUAL_EDITION=public npx playwright test screens.spec.js 
          APP_EDITION=preview npm run build
          APP_EDITION=preview VISUAL_EDITION=preview npx playwright test screens.spec.js 
      - name: Publish only review images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/review-candidates/chg-062
          git commit -m 'test: collect pinned CHG-062 shared-header candidates [skip ci]'
          git push origin HEAD:b

name: Refresh reviewed header baselines

on:
  push:
    branches: [b]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh visual]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regenerate public Chromium and WebKit references
        run: |
          npm run build:public
          env -u CI APP_EDITION=public VISUAL_EDITION=public npm run test:visual:update
      - name: Regenerate preview Chromium and WebKit references
        run: |
          npm run build:preview
          env -u CI APP_EDITION=preview VISUAL_EDITION=preview npm run test:visual:update
      - name: Record exact reviewed fingerprints
        run: env -u CI npm run visual:review -- --write
      - name: Publish the pinned references to b
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/design/baselines
          git diff --cached --quiet && { echo 'No baseline changes were generated.'; exit 1; }
          git commit -m "test: refresh pinned header visual baselines"
          git push origin HEAD:b

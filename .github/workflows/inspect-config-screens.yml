name: Inspect CHG-052 configuration differences
on:
  push:
    branches: [b]
    paths: ['.github/workflows/inspect-config-screens.yml', 'docs/design/review-inputs/chg-052-config.patch']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git apply docs/design/review-inputs/chg-052-config.patch
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Compare only affected Configure references
        id: compare
        continue-on-error: true
        run: npx playwright test screens.spec.js --grep 'practice/configure-(single|repeated)'
      - name: Publish failure images for diagnosis, never accept baselines
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import {readdirSync,mkdirSync,copyFileSync,existsSync} from 'node:fs';
          import {join,dirname} from 'node:path';
          function copy(dir){if(!existsSync(dir))return;for(const x of readdirSync(dir,{withFileTypes:true})){const p=join(dir,x.name);if(x.isDirectory())copy(p);else if(p.endsWith('.png')||p.endsWith('error-context.md')){const out=join('docs/design/review-candidates/chg-052-config',p);mkdirSync(dirname(out),{recursive:true});copyFileSync(p,out);}}}copy('test-results');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/review-candidates/chg-052-config
          git commit -m 'test: publish pinned configuration differences for diagnosis'
          git push origin HEAD:b
      - name: Preserve the failed comparison outcome
        if: steps.compare.outcome == 'failure'
        run: exit 1

name: Verify software rendering repeatability
on:
  push:
    branches: [dev]
    paths: ['visual-raster.config.js', '.github/workflows/visual-raster.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
      options: --ipc=host
    env:
      VISUAL_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:65cefd09a5e943921ecd3a6e5414c603db2eb161e9eb48f2e2ccc63486dc7dc0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx --no-install playwright test --config visual-raster.config.js
      - name: Require an unchanged exact rerun
        run: npx --no-install playwright test --config visual-raster.config.js
        env:
          VISUAL_CANDIDATES_COMPARE: '1'
      - run: node tools/visual-raster-diagnostics.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-rendering-investigation
          path: |
            playwright-report/
            test-results/
            visual-raster-candidates/
          retention-days: 14
          if-no-files-found: error
      - name: Publish candidates for review, not accepted baselines
        if: ${{ !cancelled() }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$GITHUB_REF_NAME" = 'dev'
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-raster-candidates/
          git commit -m 'test: collect software renderer repeatability evidence'
          git push origin HEAD:dev

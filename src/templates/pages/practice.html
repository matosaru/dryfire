<div class="section-head"><button id="practiceBackBtn" type="button" class="back-button" aria-label="Back to previous screen">‹</button><h2 id="practice-title">Practice</h2></div>
<a id="practiceGuideLink" class="practice-guide-link" href="#practice-guide">About this practice <span aria-hidden="true">›</span></a>
      <p class="gun-context">Practice for <strong class="gun-context-name"></strong>.</p>
      <div id="practiceSteps" class="preset-steps" aria-label="Required sounds"></div>
      <div id="practiceConfigure">
        <form id="practiceConfigForm" class="session-config-form"><fieldset id="practiceConfigFields" class="session-config-fields"><legend>Practice setup</legend>
          <label id="practiceCountRow" class="session-field" for="practiceRepetitions"><span id="practiceCountLabel">Repetitions</span><input id="practiceRepetitions" type="number" min="1" max="100" step="1" value="10" required inputmode="numeric" /></label>
          <label id="practiceDurationRow" class="session-field hidden" for="practiceDuration"><span>Active seconds</span><input id="practiceDuration" type="number" min="1" max="3600" step="1" value="60" required inputmode="numeric" /></label>
          <label id="practiceParRow" class="session-field hidden" for="practicePar"><span>Par time (seconds)</span><input id="practicePar" type="number" min="0.1" max="30" step="0.1" value="1.5" required inputmode="decimal" /></label>
          <div id="practiceReloadFields" class="session-delay-card hidden"><label class="session-field" for="practiceReloadStart"><span>First event</span><select id="practiceReloadStart"><option value="rack">Rack slide</option><option value="reload">Change magazine</option><option value="draw">Draw from holster</option><option value="trigger">Trigger pull</option></select></label><label class="session-field" for="practiceReloadEnd"><span>Second event</span><select id="practiceReloadEnd"><option value="reload">Change magazine</option><option value="rack">Rack slide</option><option value="draw">Draw from holster</option><option value="trigger">Trigger pull</option></select></label></div>
          <label class="session-field" for="practiceStartSource"><span>Start signal</span><select id="practiceStartSource"><option value="app">App signal</option><option value="external">Calibrated external beep</option></select></label>
          <div id="practiceAppTiming" class="session-delay-card"><label class="session-field" for="practiceDelayMode"><span>Ready delay</span><select id="practiceDelayMode"><option value="random">Random</option><option value="fixed">Fixed</option></select></label>
            <label id="practiceFixedRow" class="session-field hidden" for="practiceFixedDelay"><span>Delay seconds</span><input id="practiceFixedDelay" type="number" min="0" max="30" step="0.1" value="3" required inputmode="decimal" /></label>
            <div id="practiceRandomFields" class="session-delay-range"><label class="session-field" for="practiceMinDelay"><span>Minimum seconds</span><input id="practiceMinDelay" type="number" min="0" max="30" step="0.1" value="2" required inputmode="decimal" /></label><label class="session-field" for="practiceMaxDelay"><span>Maximum seconds</span><input id="practiceMaxDelay" type="number" min="0" max="30" step="0.1" value="5" required inputmode="decimal" /></label></div>
            <label class="preference-toggle" for="practiceStartSound"><span><strong>Sound at start</strong><small>Play a beep at each repetition start.</small></span><input id="practiceStartSound" type="checkbox" role="switch" checked /></label>
          </div>
        </fieldset><p id="practiceCueNote" class="muted small"></p><p id="practiceReadiness" class="session-readiness" role="status"></p><button id="practiceLearnBtn" class="button secondary wide-action hidden" type="button">Learn missing sounds</button><button id="practiceStartBtn" class="button primary wide-action" type="submit">Start Practice</button></form>
      </div>
{{practiceRun}}
{{practiceReview}}
      <p class="muted small session-timing-note">Timings describe detected audio. The app cannot verify physical actions, aim, movement or unloaded status.</p>

<dialog id="safetyModal" class="safety-modal" aria-labelledby="safetyModalTitle" aria-describedby="safetyModalDescription">
      <h2 id="safetyModalTitle">Confirm safety before practice</h2>
      <p id="safetyModalDescription">Verify the firearm is unloaded, remove live ammunition from the practice area, and use a safe direction and backstop.</p>
      <p class="muted small">The microphone cannot verify these checks. Confirmation applies to this app session.</p>
      <label class="checkbox-row"><input id="safetyModalAck" type="checkbox" /> I have completed the safety check.</label>
      <button id="safetyConfirmBtn" class="button primary wide-action" type="button" disabled>Confirm &amp; continue</button>
      <button id="safetyCancelBtn" class="button secondary wide-action" type="button">Cancel</button>
    </dialog>

<div id="practiceRun" class="hidden">
        <div class="practice-counters"><div><span id="practiceCompletedLabel">Attempts</span><strong id="practiceCompleted">0</strong></div><div><span>Shots</span><strong id="practiceShots">0</strong></div><div><span id="practiceRemainingLabel">Left</span><strong id="practiceRemaining">10</strong></div></div>
        <div class="session-countdown-panel">
          <div id="practiceSignal" class="session-countdown" role="timer" aria-live="off">—</div>
          <button id="practiceStopBtn" class="button primary practice-stop hidden" type="button" aria-label="Stop practice and save results">STOP</button>
          <div id="practiceLevelPanel" class="practice-level-panel hidden">
            <p class="practice-level-label"><svg class="practice-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><span>MICROPHONE INPUT</span></p>
            <div id="practiceLevelMeter" class="practice-level-track" role="meter" aria-label="Microphone input level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="practiceLevelFill" class="practice-level-fill"></div></div>
            <p class="practice-level-value"><strong id="practiceLevelValue">0</strong><span>relative level</span></p>
            <p id="practiceInputState" class="muted small">Waiting for audio input…</p>
          </div>
          <p id="practiceAnnouncement" class="session-announcement" role="status"></p>
          <p id="practiceInputFeedback" class="practice-input-feedback" role="status"></p>
          <p id="practiceMicrophone" class="listening-indicator" role="status"></p><p class="muted small">Active time <strong id="practiceElapsed">0.00 s</strong></p>
        </div>
        <div id="practiceLatest" class="session-result-card"></div>
        <div class="session-run-actions"><button id="practicePauseBtn" class="button secondary" type="button">Pause</button><button id="practiceResumeBtn" class="button primary hidden" type="button">Resume</button><button id="practiceNextBtn" class="button primary hidden" type="button">Next repetition</button><button id="practiceEndBtn" class="button secondary" type="button">End Practice</button></div>
      </div>

gunContext:
  prefix: "Learned sounds for "
  suffix: .
intro:
  before: Start with
  emphasis: 3 Trigger pull samples
  after: (8–10 recommended). Other sound types are optional. Each capture gives you a two-second countdown followed by a two-second recording window.
recognition:
  title: Test learned sounds
  description: Checks learned sounds. Not a timed drill; no drill results are saved.
  action: Open recognition test →
optional:
  title: Optional sounds
  summary: For handling and sequence drills
calibration:
  title: Improve recognition
  summary: Reset, noise and external cue calibration
  description: Optional rejection examples help avoid false shot counts. Very similar press/reset clicks can remain ambiguous; verify matches yourself. External-beep practice needs 3 cue samples.
privacy:
  note: The animations are illustrative sound cues, not step-by-step handling demonstrations. Resetting one sound keeps this gun's other sounds and history, and every other gun's data.
recordingTip:
  label: "Recording tip:"
  description: Use the same phone position you will use during practice. Record one natural press at a time in a representative room. Raw audio is not saved—only numeric sound features.

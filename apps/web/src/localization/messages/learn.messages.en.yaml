  note: The animations are illustrative sound cues, not step-by-step handling demonstrations. Resetting one sound keeps this gun's other sounds and history, and every other gun's data.
recordingTip:
  label: "Recording tip:"
  description: Use the same phone position you will use during practice. Record one natural press at a time in a representative room. Raw audio is not saved—only numeric sound features.

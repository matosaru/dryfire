sequence:
  builtIn: Built-in sequences
  rackTrigger: Rack slide → Trigger pull
  magazineTrigger: Magazine change → Trigger pull
  drawMagazineTrigger: Draw from holster → Magazine change → Trigger pull
  distinctSounds: Learn each distinct sound required by the selected sequence. Other sound categories remain optional.
  repetition: How a repetition works
  stepOne: Choose a sequence, repetitions and fixed or random ready delay.
  stepTwo: Confirm safety, wait for the start signal and perform the sequence.
  stepThree: The app advances only on recognized sounds in the expected order, saves each result and starts the next countdown.
  timing: Timings describe detected audio, not verified physical actions. With the sequence start beep on, the first 0.30 seconds after GO are excluded to reject the cue.
  choose: Choose a sequence
calibration:
  record: Record useful examples
  stepOne: Confirm the firearm is unloaded and complete the app safety check.
  stepTwo: Put the phone where it will stay during practice. In Learn, record one natural Trigger pull at a time. Three compatible examples are required; 8–10 are recommended and ten is the limit.
  stepThree: Read the Trigger profile status. Replace a variable example instead of adding unrelated sounds.
  stepFour: Test unseen clicks in the real room and phone position. Optional reset/noise examples can help reject similar non-trigger events.
  before: Before every practice
  beforeBody: The app listens to a short ambient window before starting the countdown. Wait for Microphone ready. If Room is noisy appears, reduce background sound or move the phone closer, then retry. Recognition remains experimental and can miss or misclassify sounds.
  missed: If clicks are missed
  missedBody: Confirm microphone permission and watch the live level meter. Keep the phone position consistent. Relearn examples after a major room, distance or audio-processing change. Match scores describe similarity and are not probabilities.
  openLearn: Open Learn
about:
  feedback: Feedback welcome
  feedbackBody: Dry Fire With Ease is a Beta sound trainer. All feedback and suggestions are welcome.
  contact: Contact us
  included: What the free app includes
  includedBody: Trigger-click calibration, four trigger practice modes, built-in sequences, live listening, local history and manual backups. No account is required.
  limits: New public gun profiles are limited to two. Existing saved data remains available; advanced feature availability follows the current public version.
contact:
  email: Email support
  prompt: "Send questions, suggestions or a bug report to:"
  privacy: Do not send private backups or raw recordings unless you deliberately choose to share them.
responsibility:
  title: Practice responsibly
  body: Verify the firearm is unloaded, remove live ammunition from the practice area and establish a safe direction and backstop. The microphone cannot verify unloaded status, aim, movement or safe handling.

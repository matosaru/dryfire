    singleSteps: |
      Kies het aantal herhalingen en de gekalibreerde externe pieptoon.
      Start en wacht op de externe pieptoon voordat je de trekker één keer overhaalt.
      Bekijk het resultaat. Tot het doel begint automatisch een nieuwe poging.
    repeatedSteps: |
      Kies het aantal klikken en de startvertraging.
      Haal na de gekalibreerde externe pieptoon de trekker afzonderlijk over, voor zover je uitrusting dat toelaat.
      De microfoon blijft luisteren zonder voor elke klik opnieuw te piepen. De resultaten verschijnen bij het doel.

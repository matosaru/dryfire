    silentStart: "Je instellingen gebruiken een stil visueel startsignaal. Wacht op het signaal op het scherm; de illustratie toont de optionele pieptoon van de app."
    appSignal: Je instellingen gebruiken het appsignaal. Je gekozen aantal en timing blijven behouden als je teruggaat naar de instellingen.

  steps: Verwachte geluidsreeks
  stepCount: "Stap {{current}} / {{total}}"
  completed: voltooid
  outOfOrder: verkeerde volgorde
  unknown: onbekend
  reset: Oefentellers resetten
  note: Een voltooide oefening betekent dat de app de gekozen reeks in de juiste volgorde heeft herkend; fysieke handelingen worden niet gecontroleerd. Onbekende geluiden gaan niet verder met de reeks.
drill:
  heading: Oefensessie
  selectionExplanation: Kies een preset om de herkende volgorde te volgen terwijl de microfoon actief blijft.
  orderedExplanation: Herken de geluidsreeks hieronder. De telling registreert geluiden en controleert geen fysieke handelingen.
  ready: "Klaar · verwacht {{sound}}."
  matched: "Herkenning · hierna: {{sound}}."
  completed: Reeks herkend ({{count}} voltooid). De app blijft luisteren voor de volgende poging.
  incorrect: "Onverwachte actie · opnieuw gestart. Verwacht {{sound}}."
  unknown: "Onbekend geluid · blijf luisteren naar {{sound}}."
capture:
  ready: Geluidsprofielen controleren…
  gun: Kies een wapen voordat je luistert.
  loading: Geluidsprofielen van dit wapen laden. Even wachten.
  busy: Rond de huidige opname of test af voordat je luistert.
  saving: Instellingen opslaan. Even wachten.
  connecting: Microfoon verbinden… Geef toestemming of verlaat deze pagina om te annuleren.
  unsaved: Sla openstaande oefenresultaten op voordat je luistert. Gebruik Opnieuw proberen op de resultatenpagina.
  session: Rond de actieve oefening af of verlaat die voordat je luistert.
  training: Leer minstens {{minimum}} trekkeropnamen ({{count}}/{{minimum}}) voor dit wapen. Open Leren om ze op te nemen. Andere geluiden zijn optioneel.
  trainedSummary: "Klaar om te testen · {{labels}}"
  start: Continu luisteren starten
  stop: Stoppen met luisteren
  single: Eén geluid testen
  sensitivity: Herkenningsgevoeligheid
  normal: Normaal
  high: Hoog (zachtere geluiden)
  low: Laag (lawaaierige ruimtes)
  inactive: Microfoon inactief
  activeIndicator: Microfoon actief · luistert naar het volgende geluid
  meter: Actueel microfoonniveau
  continuousNote: Continu luisteren blijft actief bij meerdere afzonderlijke handelingen. Pauzeer kort tussen geluiden en tik op Stoppen wanneer je klaar bent. De test voor één geluid neemt één geluid op en stopt.
  eventCounter: 0 herkend · 0 genegeerd
  eventCounts: "{{detected}} herkend · {{discarded}} genegeerd"
  stoppedNote: Microfoon gestopt. Deze sessie is beëindigd; start opnieuw voor een nieuwe reeks.
  activeNote: Na elke detectie blijft de app luisteren. Houd een korte stilte tussen acties; overlappende geluiden kunnen samenvallen. Tik op Stoppen als je klaar bent.
  timeline: Gedetecteerde handelingen in deze sessie (nieuwste eerst)

intro:
  title: Controleer je geleerde geluiden.
  description: Gebruik deze pagina om te controleren of nieuwe microfoongeluiden overeenkomen met de profielen die je bij Leren hebt opgenomen. Dit is geen oefening op tijd en oefenresultaten worden niet opgeslagen.
mode:
  eyebrow: HUIDIGE MODUS
  free: Vrij luisteren
  badge: Vrij luisteren
  training: Trainingsmodus
  freeOption: Vrij luisteren · herken elk geluid
  trigger: 1 · Trekkerbeweging
  rack: 2 · Slede bewegen → Trekkerbeweging
  magazine: 3 · Magazijnwissel → Trekkerbeweging
  draw: 4 · Trekken → Magazijnwissel → Trekkerbeweging
  explanation: Classificeer elk afzonderlijk geluid direct.

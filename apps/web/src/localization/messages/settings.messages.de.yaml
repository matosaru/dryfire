learnedSounds:
  title: Gelernte Töne
  description: Setze einen einzelnen Ton über „Zurücksetzen“ auf seiner Karte unter Lernen zurück. Das vollständige Zurücksetzen löscht die gelernten Töne dieser Waffe sowie die Kalibrierung für Reset-, Geräusch- und Signalton. Gespeicherte Ergebnisse und Daten anderer Waffen bleiben erhalten.
  reset: Alle Töne für diese Waffe zurücksetzen
backup:
  title: Sicherung & Daten
  description: Exportiere alle Waffenprofile, numerischen Klangmerkmale, Übungsvorlagen, Erkennungsverlauf, gespeicherte Einheiten und Einstellungen. Die Sicherung enthält keine Rohaufnahmen. Bewahre diese Datei sicher auf.
  export: Sicherung exportieren
  import: Sicherung importieren
  importNote: Der Import ersetzt Waffen, Töne, Verlauf, Vorlagen, Einheiten und Einstellungen auf diesem Gerät. Ältere Sicherungen enthalten keine gespeicherten Einheiten. Dateien von anderen Geräten können abweichend funktionieren.

learnedSounds:
  title: Aangeleerde geluiden
  description: Gebruik Reset op de kaart onder Leren om één geluid te wissen. Een volledige reset wist de aangeleerde geluiden van dit wapen en de kalibratie voor reset-, ruis- en pieptonen. Opgeslagen resultaten en gegevens van andere wapens blijven behouden.
  reset: Alle geluiden voor dit wapen wissen
backup:
  title: Back-up en gegevens
  description: Exporteer alle wapenprofielen, aangeleerde numerieke geluidskenmerken, drillvoorinstellingen, herkenningsgeschiedenis, opgeslagen sessies en instellingen. De back-up bevat geen ruwe opnamen. Bewaar dit bestand privé.
  export: Back-up exporteren
  import: Back-up importeren
  importNote: Importeren vervangt de opgeslagen wapens, geluiden, geschiedenis, voorinstellingen, sessies en instellingen op dit apparaat. Oudere back-ups bevatten geen opgeslagen sessies. Bestanden van een ander apparaat kunnen anders werken.

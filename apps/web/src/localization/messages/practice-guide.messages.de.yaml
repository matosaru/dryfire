  setup:
    publicEntry: Beispielwerte werden angezeigt. Gehe zurück zur Einrichtung, um Anzahl und Zeit einzustellen.
    externalCue: "Deine Einrichtung verwendet einen kalibrierten externen Signalton: kein App-Countdown und kein App-Signalton. Die Illustration zeigt die Option mit App-Signal."
    silentStart: "Deine Einrichtung verwendet ein stilles visuelles Startsignal. Warte auf das Signal auf dem Bildschirm; die Illustration zeigt den optionalen App-Signalton."
    appSignal: Deine Einrichtung verwendet das App-Signal. Deine gewählten Anzahlen und Zeiten bleiben erhalten, wenn du zur Einrichtung zurückkehrst.
  externalCue:
    singleSteps: |
      Lege die Anzahl der Wiederholungen und den kalibrierten externen Signalton fest.
      Starte und warte vor einem Abzugsklick auf den externen Signalton.
      Lies das Ergebnis. Bis zum Ziel startet automatisch ein neuer Versuch.
    repeatedSteps: |
      Lege die Anzahl der Klicks und die Bereitschaftsverzögerung fest.
      Führe nach dem kalibrierten externen Signalton einzelne Abzugsdrücke aus, soweit es deine Ausrüstung zulässt.
      Das Mikrofon hört ohne Signalton vor jedem Klick weiter zu. Die Auswertung erscheint beim Zielwert.
    parSteps: |
      Lege Zeitlimit, Wiederholungen und Bereitschaftsverzögerung fest.
      Warte auf den kalibrierten externen Signalton und drücke dann innerhalb des Zeitlimits einmal den Abzug.
      Lies das Ergebnis. Wähle Nächste Wiederholung, wenn du für einen weiteren Versuch bereit bist.
    controlSteps: |
      Lege die Klickanzahl und die Bereitschaftsverzögerung fest.
      Führe nach dem kalibrierten externen Signalton einzelne Abzugsdrücke in einem gleichmäßigen, angenehmen Tempo aus.
      Fahre bis zum Zielwert fort und vergleiche dann die aufgezeichneten Intervalle.
    singleExpect: Bei dieser Einrichtung mit externem Signalton zählen Abzugsklicks vor dem kalibrierten Signal nicht als Versuche. Das Beispiel für einen zu frühen Klick unten zeigt den App-Signalmodus.
    requirementSuffix: " Für einen Start mit externem Signalton werden drei passende Signalbeispiele benötigt."

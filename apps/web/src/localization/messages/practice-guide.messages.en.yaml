      Choose a click target and ready delay.
      After the calibrated external beep, perform separate presses at a comfortable, repeatable pace.
      Keep going until the target, then compare the recorded intervals in review.
    singleExpect: With this external-cue setup, trigger clicks before the calibrated cue are not counted as attempts. The early-failure example below demonstrates App signal mode.

      Choose your repetition target and calibrated external beep.
      Start and wait for the external beep before one trigger press.
      Read the result. A fresh attempt begins automatically until the target is reached.
    repeatedSteps: |
      Choose the number of clicks and your ready delay.
      After the calibrated external beep, perform separate trigger presses as your equipment permits.
      Listening continues without a new beep for every click. Review appears at the target.
